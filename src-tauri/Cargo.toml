[package]
name = "remit"
version = "1.1.5"
description = "Remit - Aplicación mulriplataforma de transferencia de archivos local"
authors = ["osx-mn"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "remit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.0", features = ["bundled"] }
hostname = "^0.4"
mdns-sd = "0.21.1"
local-ip-address = "0.6.6"
tauri-plugin-dialog = "2"
suppaftp = { version = "12", default-features = false }
libunftp = { version = "0.23.0", default-features = false, features = ["ring"] }
unftp-sbe-fs = "0.4.0"
notify= "8.2.0"
